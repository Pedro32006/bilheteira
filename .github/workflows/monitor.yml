name: Monitor bilheteira FPF

on:
  # O agendamento e feito externamente via cron-job.org (chamando a API de
  # workflow_dispatch), porque o "schedule" interno do GitHub Actions nao
  # e fiavel para intervalos curtos como 5 minutos.
  workflow_dispatch:
    inputs:
      test_message:
        description: "Enviar mensagem de teste no Telegram (nao verifica a pagina real)"
        type: boolean
        default: false

concurrency:
  group: monitor-bilheteira
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (only if not cached)
        run: python -m playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies (cache hit)
        run: python -m playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TEST_MESSAGE: ${{ github.event.inputs.test_message || 'false' }}
        run: python monitor_bilheteira.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "bilheteira-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- bilheteira_state.json; then
            git add bilheteira_state.json
            git commit -m "Atualiza estado da bilheteira"
            git push
          else
            echo "Sem alteracoes de estado."
          fi
